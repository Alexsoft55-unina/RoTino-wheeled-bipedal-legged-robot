controller_manager:
  ros__parameters:
    update_rate: 500  # Hz, same as the MuJoCo 0.002 s control step

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheel_effort_controller:
      type: effort_controllers/JointGroupEffortController

    leg_effort_controller:
      type: effort_controllers/JointGroupEffortController

wheel_effort_controller:
  ros__parameters:
    joints:
      - left_wheel_joint
      - right_wheel_joint

leg_effort_controller:
  ros__parameters:
    joints:
      - left_hip
      - right_hip
      - left_knee
      - right_knee
